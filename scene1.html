<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>微信</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #1a1a1a;
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    }

    .window {
      width: 400px; height: 700px;
      background: #ededed;
      border-radius: 12px;
      box-shadow: 0 24px 64px rgba(0,0,0,.6), 0 4px 16px rgba(0,0,0,.4);
      display: flex; flex-direction: column;
      overflow: hidden;
      animation: fadeIn .3s ease;
      position: relative;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(.97); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* ── 优化点：识别移动端并适配全屏 ── */
    @media (max-width: 450px) {
      body { background: #ededed; }
      .window {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* ── Top bar ── */
    .topbar {
      background: #f7f7f7;
      border-bottom: 1px solid #d9d9d9;
      display: flex; align-items: center; justify-content: center;
      padding: 0 14px; height: 50px; flex-shrink: 0;
      position: relative; z-index: 10;
    }
    .topbar-title { font-size: 17px; font-weight: 600; color: #191919; letter-spacing: .3px; }
    .back-btn {
      position: absolute; left: 14px;
      display: flex; align-items: center; gap: 3px;
      background: none; border: none; cursor: pointer;
      color: #576b95; font-size: 14px; padding: 6px 4px;
    }
    .back-btn:hover { opacity: .75; }

    /* ── Chat list ── */
    .chat-list { flex: 1; overflow-y: auto; background: #ededed; }
    .chat-list::-webkit-scrollbar { width: 0; }

    .chat-item {
      display: flex; align-items: center;
      padding: 12px 16px; gap: 12px;
      background: #f7f7f7;
      border-bottom: 1px solid #e5e5e5;
      cursor: pointer; transition: background .15s;
      position: relative; user-select: none;
    }
    .chat-item:hover { background: #ebebeb; }

    .avatar-circle {
      width: 46px; height: 46px; border-radius: 6px;
      background: #b5cce6; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #fff; font-weight: 600;
    }
    .avatar-circle.green { background: #7bbf8e; }

    .chat-info { flex: 1; min-width: 0; }
    .chat-name { font-size: 15px; color: #191919; font-weight: 500; margin-bottom: 3px; }
    .chat-preview { font-size: 13px; color: #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .badge {
      background: #fa5151; color: #fff; font-size: 11px; font-weight: 600;
      min-width: 18px; height: 18px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center; padding: 0 4px; flex-shrink: 0;
    }
    .badge.hidden { display: none; }

    /* ── Chat panel (slides in from right) ── */
    .chat-panel {
      position: absolute; inset: 0;
      background: #ededed;
      display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform .25s cubic-bezier(.4,0,.2,1);
      z-index: 20;
    }
    .chat-panel.open { transform: translateX(0); }

    .chat-topbar {
      background: #f7f7f7; border-bottom: 1px solid #d9d9d9;
      display: flex; align-items: center; justify-content: center;
      padding: 0 14px; height: 50px; flex-shrink: 0; position: relative;
    }
    .chat-topbar-title { font-size: 17px; font-weight: 600; color: #191919; }
    .chat-back-btn {
      position: absolute; left: 14px;
      display: flex; align-items: center; gap: 3px;
      background: none; border: none; cursor: pointer;
      color: #576b95; font-size: 14px; padding: 6px 4px;
    }
    .chat-back-btn:hover { opacity: .75; }

    /* ── Messages ── */
    .messages {
      flex: 1; overflow-y: auto;
      padding: 16px 12px; display: flex; flex-direction: column; gap: 14px;
    }
    .messages::-webkit-scrollbar { width: 0; }

    .msg-row { display: flex; align-items: flex-start; gap: 8px; animation: msgIn .2s ease; }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg-row.sent { flex-direction: row-reverse; }

    .msg-avatar {
      width: 36px; height: 36px; border-radius: 4px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: #fff; font-weight: 600;
    }
    .msg-avatar.recv { background: #b5cce6; }
    .msg-avatar.self { background: #7bbf8e; }

    .bubble {
      max-width: 220px; padding: 9px 12px;
      font-size: 14px; line-height: 1.5; color: #191919;
      word-break: break-word;
    }
    .bubble.recv { background: #fff; border-radius: 0 8px 8px 8px; }
    .bubble.sent { background: #95EC69; border-radius: 8px 0 8px 8px; }

    .sys-msg { text-align: center; font-size: 12px; color: #aaa; padding: 4px 0; }

    /* ── Wechat article card ── */
    .wx-card {
      margin-top: 8px; border: 1px solid #e0e0e0; border-radius: 6px;
      background: #fafafa; overflow: hidden; cursor: pointer;
      transition: background .15s; text-decoration: none; display: block; width: 220px;
    }
    .wx-card:hover { background: #f0f0f0; }
    .wx-card-inner { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
    .wx-card-icon {
      width: 38px; height: 38px; border-radius: 6px;
      background: #07C160; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .wx-card-icon svg { color: #fff; }
    .wx-card-text { flex: 1; min-width: 0; }
    .wx-card-title { font-size: 14px; color: #191919; font-weight: 500; }
    .wx-card-sub { font-size: 11px; color: #999; margin-top: 2px; }
    .wx-card-footer { border-top: 1px solid #e8e8e8; padding: 5px 12px; font-size: 11px; color: #aaa; }

    /* ── Input bar ── */
    .input-bar {
      background: #f7f7f7; border-top: 1px solid #d9d9d9;
      padding: 8px 12px; display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .input-bar input {
      flex: 1; height: 36px; border: 1px solid #d9d9d9; border-radius: 4px;
      padding: 0 10px; font-size: 14px; background: #fff; color: #191919;
      outline: none; font-family: inherit; transition: border-color .15s;
    }
    .input-bar input:focus { border-color: #b0b0b0; }
    .send-btn {
      height: 36px; padding: 0 16px; background: #07C160; color: #fff;
      border: none; border-radius: 4px; font-size: 14px; font-family: inherit;
      cursor: pointer; transition: background .15s; white-space: nowrap;
    }
    .send-btn:hover { background: #06ad56; }
    .send-btn:active { background: #059748; }
  </style>
</head>
<body>

<div class="window">

  <div class="topbar">
    <button class="back-btn" onclick="location.href='index.html'">
      <svg width="9" height="15" viewBox="0 0 9 15" fill="none">
        <path d="M8 1L1.5 7.5L8 14" stroke="#576b95" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      返回
    </button>
    <span class="topbar-title">微信</span>
  </div>

  <div class="chat-list">

    <div class="chat-item" onclick="openChat('coworkerA')">
      <div class="avatar-circle green">A</div>
      <div class="chat-info">
        <div class="chat-name">同事A</div>
        <div class="chat-preview">今天的会议纪要发一下</div>
      </div>
      <div class="badge" id="badge-coworkerA">1</div>
    </div>

    <div class="chat-item" onclick="openChat('colleague')">
      <div class="avatar-circle">新</div>
      <div class="chat-info">
        <div class="chat-name">新同事</div>
        <div class="chat-preview">你跟边伯贤前辈最近还好吗？</div>
      </div>
      <div class="badge" id="badge-colleague">1</div>
    </div>

  </div>

  <div class="chat-panel" id="panel-colleague">
    <div class="chat-topbar">
      <button class="chat-back-btn" onclick="closeChat('colleague')">
        <svg width="9" height="15" viewBox="0 0 9 15" fill="none">
          <path d="M8 1L1.5 7.5L8 14" stroke="#576b95" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        返回
      </button>
      <span class="chat-topbar-title">新同事</span>
    </div>

    <div class="messages" id="msgs-colleague">
      <div class="msg-row">
        <div class="msg-avatar recv">新</div>
        <div class="bubble recv">你跟边伯贤前辈最近还好吗？</div>
      </div>
      <div class="msg-row">
        <div class="msg-avatar recv">新</div>
        <div>
          <div class="bubble recv" style="border-radius:0 8px 8px 8px">对了，你看看这个公众号，里面写的好像你们的故事……</div>
          <a class="wx-card" href="https://mp.weixin.qq.com/s/W_NcU731zE73ydHGKhbGww" target="_blank" id="wx-article-link">
            <div class="wx-card-inner">
              <div class="wx-card-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="14" rx="2"/>
                  <path d="M8 21h8M12 17v4"/>
                </svg>
              </div>
              <div class="wx-card-text">
                <div class="wx-card-title">我们的日常</div>
                <div class="wx-card-sub">点击查看文章</div>
              </div>
            </div>
            <div class="wx-card-footer">公众号</div>
          </a>
        </div>
      </div>
    </div>

    <div class="input-bar">
      <input type="text" placeholder="输入消息…"/>
      <button class="send-btn">发送</button>
    </div>
  </div>

  <div class="chat-panel" id="panel-coworkerA">
    <div class="chat-topbar">
      <button class="chat-back-btn" onclick="closeChat('coworkerA')">
        <svg width="9" height="15" viewBox="0 0 9 15" fill="none">
          <path d="M8 1L1.5 7.5L8 14" stroke="#576b95" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        返回
      </button>
      <span class="chat-topbar-title">同事A</span>
    </div>

    <div class="messages" id="msgs-coworkerA">
      <div class="sys-msg">输入他的名字，看看TA还记不记得</div>
    </div>

    <div class="input-bar">
      <input type="text" id="input-coworkerA" placeholder="输入消息…"
             onkeydown="if(event.key==='Enter') sendCoworkerA()"/>
      <button class="send-btn" onclick="sendCoworkerA()">发送</button>
    </div>
  </div>

</div>

<script>
  let coworkerAReplyCount = 0;

  function openChat(id) {
    document.getElementById('panel-' + id).classList.add('open');
    if (id === 'colleague') {
      document.getElementById('badge-colleague').classList.add('hidden');
    }
    // 进入同事A聊天时，同步将未读标识隐藏
    if (id === 'coworkerA') {
      document.getElementById('badge-coworkerA').classList.add('hidden');
    }
  }

  function closeChat(id) {
    document.getElementById('panel-' + id).classList.remove('open');
  }

  function sendCoworkerA() {
    const input = document.getElementById('input-coworkerA');
    const text  = input.value.trim();
    if (!text) return;

    const msgs = document.getElementById('msgs-coworkerA');
    appendBubble(msgs, text, 'sent');
    input.value = '';
    scrollBottom(msgs);

    if (text === '边伯贤') {
      coworkerAReplyCount++;
      const reply = coworkerAReplyCount === 1
        ? '边伯贤？我们公司有这个人吗？……等等，我好像记得这个名字，但怎么都想不起来脸。'
        : '没听过，你记错了吧？';
      setTimeout(() => {
        appendBubble(msgs, reply, 'recv', 'A');
        scrollBottom(msgs);
      }, 650);
    }
  }

  function appendBubble(container, text, side, avatarLabel) {
    const row = document.createElement('div');
    row.className = 'msg-row' + (side === 'sent' ? ' sent' : '');

    const av = document.createElement('div');
    av.className = 'msg-avatar ' + (side === 'sent' ? 'self' : 'recv');
    av.textContent = side === 'sent' ? '我' : (avatarLabel || '?');
    row.appendChild(av);

    const bub = document.createElement('div');
    bub.className = 'bubble ' + side;
    bub.textContent = text;
    row.appendChild(bub);

    container.appendChild(row);
  }

  function scrollBottom(el) {
    setTimeout(() => { el.scrollTop = el.scrollHeight; }, 50);
  }

  // 补充公众号链接：调用 setArticleLink('https://...') 即可
  function setArticleLink(url) {
    document.getElementById('wx-article-link').href = url;
  }
</script>

</body>
</html>
