    <style>
        /* ==========================================================================
           2000年代古早复古企业网页全局样式（直角、无现代圆角）
           ========================================================================== */
        * {
            box-sizing: border-box;
            border-radius: 0 !important; /* 严格直角边框 */
        }

        body {
            background-color: #F5F5F5;
            margin: 0;
            padding: 0;
            font-family: "SimSun", "宋体", "Microsoft YaHei", "微软雅黑", sans-serif;
            font-size: 13px;
            color: #333333;
            line-height: 1.6;
        }

        /* 居中主容器 - 保持与 scene6 相关页面宽度一致 */
        .wrapper {
            width: 1000px;
            margin: 0 auto;
            background-color: #FFFFFF;
            border-left: 1px solid #D3D3D3;
            border-right: 1px solid #D3D3D3;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ==========================================================================
           顶部导航栏（与首页一致，首页链接至 scene6.html，新闻中心链接至 scene6-news.html）
           ========================================================================== */
        .navbar {
            width: 100%;
            height: 45px;
            background-color: #B52322; /* 标志性红底 */
            display: flex;
            align-items: center;
        }

        .nav-links {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .nav-links a {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #FFFFFF;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            border-right: 1px solid #D65352; /* 浅红分隔线 */
        }

        .nav-links a:last-child {
            border-right: none;
        }

        .nav-links a:hover {
            background-color: #D65352; /* 悬停变浅红 */
            text-decoration: none;
        }

        /* ==========================================================================
           主体内容区
           ========================================================================== */
        .main-content {
            padding: 30px;
            flex: 1;
        }

        /* 页面标题 */
        .page-title {
            font-size: 20px;
            color: #B52322;
            font-weight: bold;
            border-bottom: 2px solid #B52322;
            padding-bottom: 8px;
            margin-top: 0;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        /* 副标题（带特殊寓意） */
        .page-subtitle {
            font-size: 12px;
            color: #666666;
            margin-bottom: 30px;
            font-style: italic;
            border-left: 3px solid #CCCCCC;
            padding-left: 10px;
        }

        /* ==========================================================================
           员工列表表格布局结构（4行3列）
           ========================================================================== */
        .employee-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #CCCCCC;
        }

        .employee-table td {
            width: 33.33%;
            padding: 20px;
            border: 1px solid #EFEFEF;
            text-align: center;
            vertical-align: top;
            background-color: #FAFAFA;
        }

        /* 员工卡片内部容器 */
        .employee-card {
            display: inline-block;
            text-align: center;
        }

        /* 照片外框（100x120 占位控制） */
        .photo-container {
            width: 100px;
            height: 120px;
            margin: 0 auto 12px auto;
            border: 1px solid #999999;
            background-color: #EFEFEF;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease-in-out;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: filter 0.2s ease-in-out;
        }

        /* 互动设计：当鼠标移动到照片上时照片变深，且边缘出现硬阴影模拟点击质感 */
        .photo-container:hover {
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.3) !important; /* 复古硬阴影 */
            transform: translate(-2px, -2px);
        }

        .photo-container:hover img {
            filter: brightness(0.75); /* 照片色调变深 */
        }

        /* 姓名与职位文字排版 */
        .emp-name {
            font-size: 14px;
            font-weight: bold;
            color: #000000;
            margin-bottom: 4px;
        }

        .emp-position {
            font-size: 12px;
            color: #B52322; /* 职位用标志性红字 */
            font-weight: 500;
        }

        /* ==========================================================================
           页脚
           ========================================================================== */
        .footer {
            width: 100%;
            border-top: 2px solid #B52322;
            background-color: #EFEFEF;
            padding: 15px 0;
            text-align: center;
            color: #666666;
            font-size: 12px;
        }
    </style>
</head>
